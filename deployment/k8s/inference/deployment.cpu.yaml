apiVersion: apps/v1
kind: Deployment
metadata:
  name: cxr-inference-cpu
  namespace: inference
  labels:
    app: cxr-inference-cpu

spec:
  replicas: 2
  selector:
    matchLabels:
      app: cxr-inference-cpu

  template:
    metadata:
      labels:
        app: cxr-inference-cpu

    spec:
      nodeSelector:
        type: "cpu"

      containers:
      - name: inference-cpu
        image: localhost/cxr-cpu:latest
        imagePullPolicy: IfNotPresent
        ports:
          - containerPort: 8000
        resources:
          requests:
            cpu: "1000m"
            memory: "2Gi"
          limits:
            cpu: "2000m"
            memory: "4Gi"
        env:
          - name: MODEL_TYPE
            value: "cpu"

        volumeMounts:
          - name: preprocessing-config
            mountPath: /app/config/preprocessing_config.json
            subPath: preprocessing_config.json

      volumes:
        - name: preprocessing-config
          configMap:
            name: preprocessing-config



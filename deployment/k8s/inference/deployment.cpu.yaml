apiVersion: apps/v1
kind: Deployment
metadata:
  name: cxr-inference-cpu
  namespace: inference
  labels:
    app: cxr-inference-cpu

spec:
  replicas: 1
  selector:
    matchLabels:
      app: cxr-inference-cpu

  template:
    metadata:
      labels:
        app: cxr-inference-cpu

    spec:
      containers:
      - name: inference-cpu
        image: localhost/cxr-api:cpu
        imagePullPolicy: Never

        ports:
          - containerPort: 8000

        env:
          - name: MODEL_TYPE
            value: "cpu"

        volumeMounts:
          - name: checkpoints-volume
            mountPath: /app/checkpoints

        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 3
          periodSeconds: 5

        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10

      volumes:
        - name: checkpoints-volume
          hostPath:
            # Replace /lab/px/AnichLabs/cxr-cnn-k8s-benchmark with the actual project root.
            path: /var/lib/cxr-checkpoints
            type: Directory
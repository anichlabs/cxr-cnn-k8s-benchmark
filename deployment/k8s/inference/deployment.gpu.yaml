apiVersion: apps/v1
kind: Deployment
metadata:
  name: cxr-inference-gpu
  namespace: inference
  labels:
    app: cxr-inference-gpu

spec:
  replicas: 1
  selector:
    matchLabels:
      app: cxr-inference-gpu

  template:
    metadata:
      labels:
        app: cxr-inference-gpu

    spec:
      containers:
      - name: inference-gpu
        image: cxr-api:gpu
        imagePullPolicy: IfNotPresent

        ports:
          - containerPort: 8000

        env:
          - name: MODEL_TYPE
            value: "gpu"

        volumeMounts:
          - name: checkpoints-volume
            mountPath: /app/checkpoints

        resources:
          requests:
            cpu: "1000m"
            memory: "3Gi"
          limits:
            cpu: "2000m"
            memory: "6Gi"
            nvidia.com/gpu: 1

        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 3
          periodSeconds: 5

        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10

      volumes:
        - name: checkpoints-volume
          hostPath:
            # Replace /lab/px/AnichLabs/cxr-cnn-k8s-benchmark with the actual project root.
            path: /var/lib/cxr-checkpoints
            type: Directory
            
apiVersion: v1
kind: Pod
metadata:
  name: gpu-smoketest
spec:
  restartPolicy: Never
  containers:
  - name: test
    image: nvidia/cuda:12.4.1-base-ubuntu22.04
    command: ["bash", "-c"]
    args:
      - |
        echo "Running nvidia-smi...";
        nvidia-smi;
        echo "Keeping pod alive...";
        sleep infinity
    resources:
      limits:
        nvidia.com/gpu: 1
